<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
  The link preview — what WhatsApp, iMessage, Slack and the rest show when someone shares the site.
  Rendered to assets/images/open-graph.jpg by `yarn og:build`, at the 1200×630 every platform crops
  to. Drawn like the invitation email (tools/emails/header.html): the names in heavy Archivo capitals,
  the handwritten plum byline, the mono date bar, and the proposal photo.
-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Caveat:wght@700&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .card {
        box-sizing: border-box;
        display: flex;
        width: 1200px;
        height: 630px;
        padding: 36px;
        gap: 44px;
        background: #f3f1ea;
        color: #131412;
      }
      .words {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 20px 0 20px 28px;
      }
      .mono {
        font:
          500 19px/1 'JetBrains Mono',
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .names {
        margin: auto 0 0;
        font:
          900 128px/0.84 'Archivo',
          sans-serif;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .names span {
        display: block;
      }
      .byline {
        margin: 6px 0 auto 4px;
        font:
          700 64px/1 'Caveat',
          cursive;
        color: #972a6a;
        transform: rotate(-2deg);
        transform-origin: left center;
      }
      .foot {
        color: #1e4632;
      }
      .photo {
        width: 470px;
        flex-shrink: 0;
        border-radius: 16px;
        background: url('../emails/img/photo.jpg') 46% center / cover no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="words">
        <div class="mono">S&amp;L / 12.02.27</div>
        <h1 class="names"><span>Sam &amp;</span><span>Lauren</span></h1>
        <div class="byline">are getting married</div>
        <div class="mono foot">12–14 Feb 2027 · The Lodge Jamberoo NSW</div>
      </div>
      <div class="photo" role="img" aria-label="Sam proposing to Lauren under a green garden arch by the water"></div>
    </div>
  </body>
</html>
