<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
  The email header, rendered to img/header.png by `yarn emails:build`. An image, not live text,
  because Gmail and Outlook ignore web fonts: the site's heavy Archivo capitals and the handwritten
  Caveat byline would fall back to a system font there. Same type, sizes and colours as the home
  hero (sections/HeroSection), at 2x for a 600px email.
-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Caveat:wght@700&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        background: #f3f1ea;
      }
      .header {
        box-sizing: border-box;
        width: 1200px;
        padding: 72px 80px 64px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        font:
          500 26px/1 'JetBrains Mono',
          monospace;
        letter-spacing: 0.04em;
        color: #131412;
      }
      .names {
        margin: 64px 0 0;
        font:
          900 196px/0.84 'Archivo',
          sans-serif;
        letter-spacing: -0.045em;
        text-transform: uppercase;
        color: #131412;
      }
      .names span {
        display: block;
      }
      .byline {
        display: inline-block;
        margin: -6px 0 0 4px;
        font:
          700 92px/1 'Caveat',
          cursive;
        color: #972a6a;
        transform: rotate(-2deg);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="bar"><span>S&amp;L / 12.02.27</span><span>JAMBEROO NSW</span></div>
      <h1 class="names"><span>Sam &amp;</span><span>Lauren</span></h1>
      <div class="byline">are getting married</div>
    </div>
  </body>
</html>
